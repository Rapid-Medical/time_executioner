# Configuration for SonarQube Cloud Automatic Analysis.
#
# The documentation describes this as read from the default branch, but changes
# here were observed taking effect on the pull request that introduced them.

# Without these, SonarPython reports that it found files looking like test code
# but could not tell them apart from production code, and skips rules on them.
#
# .github is listed deliberately: narrowing sources to src alone takes the
# workflow files out of analysis entirely, which silently disables the GitHub
# Actions rules. Those rules caught a real problem here -- the release job
# building its artifact after installing the unpinned dev extra -- so they are
# worth keeping on. The cost is a few false positives on `pip install -e .`
# that have to be marked won't-fix in the UI.
sonar.sources=src,.github
sonar.tests=tests

# Analysis defaults to "compatible with all Python 3 versions" otherwise, which
# is both less precise and wrong for this project: requires-python is >=3.11.
# Must track requires-python in pyproject.toml and the CI matrix.
sonar.python.version=3.11, 3.12, 3.13, 3.14
