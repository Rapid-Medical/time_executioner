# Configuration for SonarQube Cloud Automatic Analysis.
#
# Note: this file is read from the repository's default branch, so changes here
# take effect once merged, not on the pull request that introduces them.

# Without these, SonarPython reports that it found files looking like test code
# but could not tell them apart from production code, and skips rules on them.
sonar.sources=src
sonar.tests=tests

# Analysis defaults to "compatible with all Python 3 versions" otherwise, which
# is both less precise and wrong for this project: requires-python is >=3.11.
# Must track requires-python in pyproject.toml and the CI matrix.
sonar.python.version=3.11, 3.12, 3.13, 3.14
