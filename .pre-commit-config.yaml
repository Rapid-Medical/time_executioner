repos:
-  repo: https://github.com/psf/black
   rev: 23.7.0
   hooks:
    - id: black
      args:
      - --line-length=100
      - .
- repo: https://github.com/pycqa/isort
  rev: 5.12.0
  hooks:
  - id: isort
    args:
      - --profile=black
      - --line-length=100
      - .
- repo: https://github.com/pycqa/flake8
  rev: 6.1.0
  hooks:
  - id: flake8
    args:
    - --max-line-length=100
    - --extend-ignore=E203
    - .
- repo: https://github.com/pycqa/bandit
  rev: 1.8.6
  hooks:
  - id: bandit
    args:
    - -r
    - -x
    # the hook passes `.`, so without these excludes bandit recurses into a
    # local virtualenv and fails on third-party asserts
    - "*test*.py,./.venv/*,./venv/*,./build/*,./dist/*"
    - .
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.5.0
  hooks:
  -   id: mypy
      args: [--ignore-missing-imports]
      additional_dependencies: ['types-requests', 'freezegun']
