# Configuration for the SonarQube Cloud CI-based scanner, run from the
# `sonarqube` job in .github/workflows/python-package.yml.
#
# Automatic Analysis was previously in use and is now switched off in the
# project's settings. The two modes are mutually exclusive, and only CI
# analysis can import a coverage report -- which is why this file replaced
# .sonarcloud.properties.

# Automatic Analysis inferred these from the repository binding. The scanner
# does not; without them it refuses to run.
sonar.projectKey=Rapid-Medical_time_executioner
sonar.organization=rapid-medical

# Without these, SonarPython reports that it found files looking like test code
# but could not tell them apart from production code, and skips rules on them.
#
# .github is listed deliberately: narrowing sources to src alone takes the
# workflow files out of analysis entirely, which silently disables the GitHub
# Actions rules. Those rules caught a real problem here -- the release job
# building its artifact after installing the unpinned dev extra -- so they are
# worth keeping on.
#
# pylock.toml is listed for a different reason: text:S8565 ("Python dependency
# lock file should be committed to source control") only stays cleared while
# the lock is indexed, and the scanner indexes nothing outside sonar.sources.
# Automatic Analysis found it at the repository root without being told to;
# the scanner will not.
sonar.sources=src,.github,pylock.toml
sonar.tests=tests

# Analysis defaults to "compatible with all Python 3 versions" otherwise, which
# is both less precise and wrong for this project: requires-python is >=3.11.
# Must track requires-python in pyproject.toml and the CI matrix.
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Written by the 3.11 leg of the test job, passed to the scan job as an
# artifact. Relative to this file, which sits at the analysis root.
sonar.python.coverage.reportPaths=coverage.xml

# Known false positives, kept here rather than as won't-fix clicks in the
# dashboard so that they are reviewable in a diff and survive a project reset.
# .sonarcloud.properties could not express these; this file can.
#
# githubactions:S8544 ("Python dependencies should be locked to verified
# versions") fires on `pip install -e . --no-deps`. The project itself cannot
# be a pylock.toml entry -- pip rejects a directory source alongside hashed
# ones -- so installing it separately is deliberate, and every dependency it
# would otherwise pull is already installed from the hashed lock on the line
# above it.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/*.yml
