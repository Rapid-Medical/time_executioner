# Install dependencies, lint, test across supported Python versions, verify that
# the built distribution is actually installable and importable, and send the
# result to SonarQube Cloud with a coverage report attached.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Must track requires-python in pyproject.toml
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    # installs the package itself, so tests import the real artifact rather
    # than the working-tree source layout
    - name: Install dependencies
      run: |
        # bootstrap a known pip first: pylock.toml support needs pip >= 25.1
        python -m pip install --require-hashes -r requirements-bootstrap.txt
        # every dependency resolved from the PEP 751 lock, hashes verified
        python -m pip install -r pylock.toml
        # the project itself, from the working tree; --no-deps so nothing is
        # resolved from the network here
        python -m pip install -e . --no-deps
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      # Coverage is measured on every leg, so a version-specific gap in the
      # suite still shows up in that leg's log. Only the 3.11 report is handed
      # to Sonar: it accepts one report, and all four legs exercise the same
      # lines.
      run: pytest --cov=time_executioner --cov-branch --cov-report=xml --cov-report=term
    - name: Upload the coverage report for the Sonar scan
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: coverage
        path: coverage.xml
        # a silently absent report makes Sonar show 0% rather than fail
        if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        # bootstrap a known pip first: pylock.toml support needs pip >= 25.1
        python -m pip install --require-hashes -r requirements-bootstrap.txt
        # every dependency resolved from the PEP 751 lock, hashes verified
        python -m pip install -r pylock.toml
        # the project itself, from the working tree; --no-deps so nothing is
        # resolved from the network here
        python -m pip install -e . --no-deps
    - name: Cache pre-commit hook environments
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run pre-commit (black, isort, flake8, bandit, mypy)
      run: pre-commit run --all-files --show-diff-on-failure

  build:
    # Guards the packaging bugs that a source-tree test run cannot see:
    # stray top-level files, a missing py.typed, or a version that
    # silently resolves to 0.0.0.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        # bootstrap a known pip first: pylock.toml support needs pip >= 25.1
        python -m pip install --require-hashes -r requirements-bootstrap.txt
        # every dependency resolved from the PEP 751 lock, hashes verified
        python -m pip install -r pylock.toml
        # the project itself, from the working tree; --no-deps so nothing is
        # resolved from the network here
        python -m pip install -e . --no-deps
    - name: Build sdist and wheel
      run: python -m build
    - name: Check distribution metadata
      run: twine check dist/*
    - name: Verify wheel contents
      run: |
        set -euo pipefail
        echo "--- wheel contents ---"
        python -m zipfile --list dist/*.whl
        # every file must live under the package dir or its .dist-info;
        # a bare top-level file would pollute site-packages
        stray=$(python -m zipfile --list dist/*.whl \
          | awk 'NR>1 {print $1}' \
          | grep -Ev '^(time_executioner/|time_executioner-.*\.dist-info/)' \
          | grep -E '\S' || true)
        if [ -n "$stray" ]; then
          echo "ERROR: wheel contains files outside the package:"
          echo "$stray"
          exit 1
        fi
        python -m zipfile --list dist/*.whl | grep -q 'time_executioner/py.typed' \
          || { echo "ERROR: py.typed missing from wheel"; exit 1; }
    - name: Install the wheel in a clean env and smoke-test it
      # a bare venv with no project tooling: this is what a user gets from
      # `pip install time_executioner`. The package declares zero runtime
      # dependencies, so nothing is resolved from the network here.
      run: |
        set -euo pipefail
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install dist/*.whl
        /tmp/smoke/bin/python - <<'PY'
        import importlib.metadata as md
        import pathlib
        import time_executioner as te
        from time_executioner import TimeExecutioner

        version = md.version("time_executioner")
        assert version == te.__version__, f"{version} != {te.__version__}"
        assert version != "0.0.0", "version did not resolve; check tool.setuptools.dynamic"
        assert (pathlib.Path(te.__file__).parent / "py.typed").exists(), "py.typed not installed"

        @TimeExecutioner.log
        def work(x: int) -> int:
            return x * 2

        assert work(21) == 42
        with TimeExecutioner.time("smoke"):
            pass
        print(f"smoke test OK: time_executioner {version}")
        PY

  sonarqube:
    name: SonarQube Cloud
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Dependabot pull requests run without access to repository secrets, so the
    # scan cannot authenticate on them. Skipping keeps dependency bumps green
    # instead of permanently red; those commits are analysed when they land on
    # main.
    if: github.actor != 'dependabot[bot]'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Sonar reads git history to attribute issues and to work out which
        # lines are new; a shallow clone leaves both wrong.
        fetch-depth: 0
    - name: Download the coverage report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: coverage
    - name: SonarQube Cloud scan
      # Configuration lives in sonar-project.properties, including the path to
      # the coverage report downloaded above.
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
